<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>FitTrack Pro - Aviso de Suscripción</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #0f172a; color: #f8fafc; padding: 20px;">
    <div style="background-color: #1e293b; border-radius: 10px; padding: 30px; max-width: 600px; margin: 0 auto; border: 1px solid #ef4444;">
        <h2 style="color: #ef4444; margin-bottom: 20px;">Aviso Importante, <span th:text="${nombre}">Usuario</span> ⚠️</h2>
        <p style="font-size: 16px; line-height: 1.5; color: #cbd5e1;">Tu suscripción a FitTrack Pro ha vencido o está a punto de vencer.</p>
        
        <p style="font-size: 16px; line-height: 1.5; color: #cbd5e1;">
            Para seguir accediendo a tus rutinas y el seguimiento de tu entrenador, por favor renueva tu suscripción a la brevedad.
        </p>
        
        <p style="font-size: 14px; color: #94a3b8; margin-top: 30px;">
            Atentamente,<br>
            El equipo de FitTrack Pro
        </p>
    </div>
</body>
</html>
